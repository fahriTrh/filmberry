name: Dependency Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  scan:
    uses: fahriTrh/dependency-scanner/.github/workflows/dependency-scan.yml@master
    with:
      mode: local
      scanner-repo: fahriTrh/dependency-scanner
      upload-sarif: true
    permissions:
      contents: read
      security-events: write